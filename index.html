<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculatrice HELORA</title>
  <!-- Nunito : police arrondie gratuite, proche de Gotham Rounded (charte HELORA) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculatrice">

    <!-- Logo HELORA redessiné en traits arrondis : le sigle « +| » forme le H, suivi de ELORA.
         Vectoriel, il reste identique sur tous les appareils, sans dépendre d'une police. -->
    <header class="brand">
      <svg class="brand__logo" viewBox="0 0 600 100" role="img" aria-label="HELORA">
        <path d="M6 50H94M49 6V94M113 6V94" />                  <!-- +| = H -->
        <path d="M197 6H149V94H197M149 50H190" />               <!-- E -->
        <path d="M232 6V94H280" />                              <!-- L -->
        <circle cx="345" cy="50" r="44" />                      <!-- O -->
        <path d="M429 94V6H463A23 23 0 0 1 463 52H429M456 52L488 94" />  <!-- R -->
        <path d="M512 94L553 6L594 94M525 66H581" />            <!-- A -->
      </svg>
      <span class="brand__tag">Calculatrice</span>
    </header>

    <!-- Écran : expression en cours + aperçu du résultat -->
    <section class="display">
      <button class="backspace" data-action="backspace" aria-label="Effacer le dernier caractère">⌫</button>
      <output class="expression" id="expression" aria-live="polite"></output>
      <output class="result" id="result" aria-live="polite">0</output>
    </section>

    <!-- Clavier : data-value = caractère ajouté à l'expression, data-action = commande -->
    <section class="keypad">
      <button class="key key--function" data-action="clear">AC</button>
      <button class="key key--function" data-value="(">(</button>
      <button class="key key--function" data-value=")">)</button>
      <button class="key key--operator" data-value="÷" aria-label="Diviser">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key key--operator" data-value="×" aria-label="Multiplier">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key key--operator" data-value="−" aria-label="Soustraire">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key key--operator" data-value="+" aria-label="Additionner">+</button>

      <button class="key key--function" data-value="%" aria-label="Pourcentage">%</button>
      <button class="key" data-value="0">0</button>
      <button class="key" data-value="," aria-label="Virgule">,</button>
      <button class="key key--equals" data-action="equals" aria-label="Égal">=</button>
    </section>

    <!-- Numéro de version : à mettre à jour à chaque étape (et dans package.json) -->
    <footer class="version">v5</footer>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
